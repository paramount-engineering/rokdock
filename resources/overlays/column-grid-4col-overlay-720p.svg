<?xml version="1.0" encoding="UTF-8"?>
<!--
  4-Column Grid Overlay - HD (1280x720)
  RokDock Dark Theme
  Column width: 320 px  |  4 x 320 = 1280
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">

  <defs>
    <filter id="shadowLight" x="-10%" y="-30%" width="130%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,5 L7,2.5 Z" fill="#e6e9ff" fill-opacity="0.85"/>
    </marker>
    <style>
      .title-label { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
      .col-num { font-family: 'Consolas', 'Courier New', monospace; text-anchor: middle; dominant-baseline: central; fill: #b59aff; filter: url(#shadowLight); }
      .grid-label { font-family: 'Consolas', 'Courier New', monospace; dominant-baseline: central; fill: #b59aff; fill-opacity: 0.85; filter: url(#shadowLight); }
      .meas-line { stroke: #e6e9ff; stroke-opacity: 0.9; stroke-width: 2.75; }
      .meas-label { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 13px; text-anchor: middle; dominant-baseline: central; fill: #e6e9ff; filter: url(#shadowLight); }
    </style>
  </defs>

  <!-- Screen border -->
  <rect x="1" y="1" width="1278" height="718" fill="none" stroke="#6dd3ff" stroke-width="2.75" stroke-opacity="0.52"/>

  <!-- Action safe zone reference lines -->
  <line x1="64"   y1="0"   x2="64"   y2="720" stroke="#49507a" stroke-opacity="0.72" stroke-width="2.35" stroke-dasharray="6,4"/>
  <line x1="1216" y1="0"   x2="1216" y2="720" stroke="#49507a" stroke-opacity="0.72" stroke-width="2.35" stroke-dasharray="6,4"/>
  <line x1="0"    y1="36"  x2="1280" y2="36"  stroke="#49507a" stroke-opacity="0.72" stroke-width="2.35" stroke-dasharray="6,4"/>
  <line x1="0"    y1="684" x2="1280" y2="684" stroke="#49507a" stroke-opacity="0.72" stroke-width="2.35" stroke-dasharray="6,4"/>

  <!-- Alternating column fills (even columns: 2,4) -->
  <rect x="320" y="0" width="320" height="720" fill="#b59aff" fill-opacity="0.045"/>
  <rect x="960" y="0" width="320" height="720" fill="#b59aff" fill-opacity="0.045"/>

  <!-- Column dividers -->
  <line x1="320" y1="0" x2="320" y2="720" stroke="#b59aff" stroke-width="3.5" stroke-opacity="0.78"/>
  <line x1="640" y1="0" x2="640" y2="720" stroke="#b59aff" stroke-width="3.5" stroke-opacity="0.78"/>
  <line x1="960" y1="0" x2="960" y2="720" stroke="#b59aff" stroke-width="3.5" stroke-opacity="0.78"/>

  <!-- Column numbers 1-4 -->
  <text x="160"  y="20" class="col-num" font-size="17">1</text>
  <text x="480"  y="20" class="col-num" font-size="17">2</text>
  <text x="800"  y="20" class="col-num" font-size="17">3</text>
  <text x="1120" y="20" class="col-num" font-size="17">4</text>

  <!-- Subtitle label (bottom-right for consistency) -->
  <text x="1275" y="712" class="grid-label" font-size="12" text-anchor="end">4-col | 320 px each</text>

  <!-- Measurement arrow: one column width (320 px) at y=700 -->
  <!-- Left segment: x=2 to x=132, marker-start (arrow points right toward center) -->
  <line x1="2" y1="700" x2="132" y2="700" class="meas-line" marker-start="url(#arrow)"/>
  <!-- Right segment: x=188 to x=318, marker-end -->
  <line x1="188" y1="700" x2="318" y2="700" class="meas-line" marker-end="url(#arrow)"/>
  <!-- Label -->
  <text x="160" y="700" class="meas-label">320 px</text>

</svg>
