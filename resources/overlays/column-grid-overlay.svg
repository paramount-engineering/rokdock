<?xml version="1.0" encoding="UTF-8"?>
<!--
  12-Column Grid Overlay - Full HD (1920x1080)
  RokDock Dark Theme
  Column width: 160 px  |  12 x 160 = 1920
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">

  <defs>
    <filter id="shadowLight" x="-10%" y="-30%" width="130%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7.5" refY="3"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L8,3 Z" fill="#e6e9ff" fill-opacity="0.85"/>
    </marker>
    <style>
      .title-label { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
      .col-num { font-family: 'Consolas', 'Courier New', monospace; text-anchor: middle; dominant-baseline: central; fill: #b59aff; filter: url(#shadowLight); }
      .grid-label { font-family: 'Consolas', 'Courier New', monospace; dominant-baseline: central; fill: #b59aff; fill-opacity: 0.85; filter: url(#shadowLight); }
      .meas-line { stroke: #e6e9ff; stroke-opacity: 0.9; stroke-width: 2.75; }
      .meas-label { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 18px; text-anchor: middle; dominant-baseline: central; fill: #e6e9ff; filter: url(#shadowLight); }
    </style>
  </defs>

  <!-- Screen border -->
  <rect x="1" y="1" width="1918" height="1078" fill="none" stroke="#6dd3ff" stroke-width="3.5" stroke-opacity="0.68"/>

  <!-- Action safe zone reference lines -->
  <line x1="96" y1="0" x2="96" y2="1080" stroke="#49507a" stroke-opacity="0.72" stroke-width="2.35" stroke-dasharray="6,4"/>
  <line x1="1824" y1="0" x2="1824" y2="1080" stroke="#49507a" stroke-opacity="0.72" stroke-width="2.35" stroke-dasharray="6,4"/>
  <line x1="0" y1="54" x2="1920" y2="54" stroke="#49507a" stroke-opacity="0.72" stroke-width="2.35" stroke-dasharray="6,4"/>
  <line x1="0" y1="1026" x2="1920" y2="1026" stroke="#49507a" stroke-opacity="0.72" stroke-width="2.35" stroke-dasharray="6,4"/>

  <!-- Alternating column fills (even columns) -->
  <rect x="160" y="0" width="160" height="1080" fill="#b59aff" fill-opacity="0.06"/>
  <rect x="480" y="0" width="160" height="1080" fill="#b59aff" fill-opacity="0.06"/>
  <rect x="800" y="0" width="160" height="1080" fill="#b59aff" fill-opacity="0.06"/>
  <rect x="1120" y="0" width="160" height="1080" fill="#b59aff" fill-opacity="0.06"/>
  <rect x="1440" y="0" width="160" height="1080" fill="#b59aff" fill-opacity="0.06"/>
  <rect x="1760" y="0" width="160" height="1080" fill="#b59aff" fill-opacity="0.06"/>

  <!-- Column dividers -->
  <line x1="160" y1="0" x2="160" y2="1080" stroke="#b59aff" stroke-width="2.65" stroke-opacity="0.74"/>
  <line x1="320" y1="0" x2="320" y2="1080" stroke="#b59aff" stroke-width="2.65" stroke-opacity="0.74"/>
  <line x1="480" y1="0" x2="480" y2="1080" stroke="#b59aff" stroke-width="2.65" stroke-opacity="0.74"/>
  <line x1="640" y1="0" x2="640" y2="1080" stroke="#b59aff" stroke-width="2.65" stroke-opacity="0.74"/>
  <line x1="800" y1="0" x2="800" y2="1080" stroke="#b59aff" stroke-width="2.65" stroke-opacity="0.74"/>
  <line x1="960" y1="0" x2="960" y2="1080" stroke="#b59aff" stroke-width="2.65" stroke-opacity="0.74"/>
  <line x1="1120" y1="0" x2="1120" y2="1080" stroke="#b59aff" stroke-width="2.65" stroke-opacity="0.74"/>
  <line x1="1280" y1="0" x2="1280" y2="1080" stroke="#b59aff" stroke-width="2.65" stroke-opacity="0.74"/>
  <line x1="1440" y1="0" x2="1440" y2="1080" stroke="#b59aff" stroke-width="2.65" stroke-opacity="0.74"/>
  <line x1="1600" y1="0" x2="1600" y2="1080" stroke="#b59aff" stroke-width="2.65" stroke-opacity="0.74"/>
  <line x1="1760" y1="0" x2="1760" y2="1080" stroke="#b59aff" stroke-width="2.65" stroke-opacity="0.74"/>

  <!-- Column numbers 1-12 -->
  <text x="80"   y="26" class="col-num" font-size="16">1</text>
  <text x="240"  y="26" class="col-num" font-size="16">2</text>
  <text x="400"  y="26" class="col-num" font-size="16">3</text>
  <text x="560"  y="26" class="col-num" font-size="16">4</text>
  <text x="720"  y="26" class="col-num" font-size="16">5</text>
  <text x="880"  y="26" class="col-num" font-size="16">6</text>
  <text x="1040" y="26" class="col-num" font-size="16">7</text>
  <text x="1200" y="26" class="col-num" font-size="16">8</text>
  <text x="1360" y="26" class="col-num" font-size="16">9</text>
  <text x="1520" y="26" class="col-num" font-size="16">10</text>
  <text x="1680" y="26" class="col-num" font-size="16">11</text>
  <text x="1840" y="26" class="col-num" font-size="16">12</text>

  <!-- Subtitle label (bottom-right to avoid overlapping column numbers) -->
  <text x="1912" y="1070" class="grid-label" font-size="16" text-anchor="end">12-col | 160 px each</text>

  <!-- Measurement arrow: one column width (160 px) at y=1060 -->
  <!-- Left segment: x=2->44, marker-start reverses (points left, outward) -->
  <line x1="2" y1="1060" x2="38" y2="1060" class="meas-line" marker-start="url(#arrow)"/>
  <!-- Right segment: x=122->158, marker-end (points right, outward) -->
  <line x1="122" y1="1060" x2="158" y2="1060" class="meas-line" marker-end="url(#arrow)"/>
  <!-- Label -->
  <text x="80" y="1060" class="meas-label">160 px</text>

</svg>
