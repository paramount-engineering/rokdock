<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A5CF6"/>
      <stop offset="100%" stop-color="#4A23A8"/>
    </linearGradient>
    <linearGradient id="hexStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B69CFF"/>
      <stop offset="100%" stop-color="#4A23A8"/>
    </linearGradient>
    <filter id="promptShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#160a33" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Hexagon body (no background container, vibrant gradient) -->
  <path
    d="M256 20 L456 135 L456 377 L256 492 L56 377 L56 135 Z"
    fill="url(#hexGrad)"
    stroke="url(#hexStroke)"
    stroke-width="8"
  />

  <!-- Inner rim light along the hexagon edge -->
  <path
    d="M256 44 L436 148 L436 364 L256 468 L76 364 L76 148 Z"
    fill="none"
    stroke="rgba(255,255,255,0.26)"
    stroke-width="3"
  />

  <!-- Faint toolset grid behind the prompt -->
  <rect x="144" y="144" width="104" height="104" rx="21" ry="21" fill="#ffffff" opacity="0.16"/>
  <rect x="264" y="144" width="104" height="104" rx="21" ry="21" fill="#ffffff" opacity="0.16"/>
  <rect x="144" y="264" width="104" height="104" rx="21" ry="21" fill="#ffffff" opacity="0.16"/>
  <rect x="264" y="264" width="104" height="104" rx="21" ry="21" fill="#ffffff" opacity="0.16"/>

  <!-- Terminal prompt with a soft drop shadow -->
  <text
    x="256"
    y="312"
    text-anchor="middle"
    font-family="'Consolas', 'Courier New', monospace"
    font-size="196"
    font-weight="bold"
    fill="#ffffff"
    filter="url(#promptShadow)"
  >&gt;_</text>
</svg>
