<svg width="540" height="400" viewBox="0 0 540 400" xmlns="http://www.w3.org/2000/svg">
  <!--
    macOS DMG background, pre-rendered to resources/dmg-background.png (+@2x) and
    committed; electron-builder points dmg.background at it. The centre is TRANSPARENT
    so Finder shows its own appearance-adaptive window background and the icon labels
    stay legible in both light and dark mode. With a custom background the DMG window
    equals the image size (540x400). Brand lives in the solid header (hexagon-with-
    toolset-grid mark) and footer bands, using the brand gradient (#3A1C87 to #2B1663)
    run left to right. There is no caption text, so it does not matter that the Finder
    status bar overlays the bottom of the footer band.
    Icon slots (electron-builder dmg.contents): RokDock (135,125) and RokDock Tools
    (135,265) on the left, Applications (405,195) on the right. The arrow sits at their
    shared vertical centre (y=195) and points from the left column toward Applications.
    Re-render with scripts/renderDmgBackground (Playwright/Chromium) after editing.
  -->
  <defs>
    <linearGradient id="rokdockBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A1C87"/>
      <stop offset="1" stop-color="#2B1663"/>
    </linearGradient>
    <linearGradient id="rokdockArrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A1C87"/>
      <stop offset="1" stop-color="#8A6FE0"/>
    </linearGradient>
    <filter id="rokdockArrowShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Header band with the brand hexagon-with-toolset-grid mark. -->
  <rect x="0" y="0" width="540" height="56" fill="url(#rokdockBand)"/>
  <path d="M270 9 L286 19 L286 37 L270 47 L254 37 L254 19 Z"
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#FFFFFF">
    <rect x="262" y="20" width="7" height="7" rx="2"/>
    <rect x="271" y="20" width="7" height="7" rx="2"/>
    <rect x="262" y="29" width="7" height="7" rx="2"/>
    <rect x="271" y="29" width="7" height="7" rx="2"/>
  </g>

  <!-- Footer band (decorative, no text; clipping by the status bar is fine). -->
  <rect x="0" y="356" width="540" height="44" fill="url(#rokdockBand)"/>

  <!-- Drag arrow, brand purple gradient, at the icons' shared vertical centre. -->
  <path d="M229 183 H277 V167 L311 195 L277 223 V207 H229 Z"
        fill="url(#rokdockArrow)" stroke="url(#rokdockArrow)" stroke-width="8"
        stroke-linejoin="round" filter="url(#rokdockArrowShadow)"/>
</svg>
